<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCH 논문 수식 시각화 학습</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <nav class="top-nav" id="topNav"></nav>

    <section class="hero">
      <h1>JCH 논문 수식 시각화 학습</h1>
      <p>초분광 영상 기반 석회 모르타르 처리제 적합성 평가 논문의 7개 수식을 인터랙티브하게 학습합니다.</p>
      <p class="helper">수식 안의 기호에 마우스를 올리면 설명을 확인할 수 있습니다.</p>
    </section>

    <section class="cards" id="equationCards"></section>

    <section class="detail" id="detailPanel" aria-live="polite">
      <h2 id="detailTitle"></h2>
      <p id="detailSummary"></p>
      <div class="formula" id="detailFormula"></div>
      <ul id="detailPoints"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
